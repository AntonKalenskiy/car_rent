<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Car Directory</title>
</head>

<body>
<div class="container">
    <h3>Car Directory</h3>
    <hr>

    <a th:href="@{/cars-th/showFormForAdd}"
       class="btn btn-primary btn-sm mb-3">
        Add Car
    </a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Model</th>
            <th>Brand</th>
            <th>Type</th>
            <th>Inventory</th>
            <th>Daily_Fee</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="tempCar : ${cars}">
            <td th:text="${tempCar.id}"/>
            <td th:text="${tempCar.model}"/>
            <td th:text="${tempCar.brand}"/>
            <td th:text="${tempCar.type}"/>
            <td th:text="${tempCar.inventory}"/>
            <td th:text="${tempCar.dailyFee}"/>
            <td>
                <a th:href="@{/cars-th/showFormForUpdate(carId=${tempCar.id})}"
                   class="btn btn-info btn-sm">
                    Update
                </a>

                <a th:href="@{/cars-th/delete(carId=${tempCar.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="if (!(confirm('Are you sure you want to delete this car?'))) return false">
                    Delete
                </a>
            </td>
        </tr>


        </tbody>
    </table>
    <form action="#" th:action="@{/logout}" method="POST">

        <input type="submit" value="Logout"/>

    </form>
</div>
</body>
</html>
